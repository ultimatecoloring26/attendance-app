<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Attendance</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fadff0; margin: 0; }
  .main-content { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .card { background: #fffdff; width: 100%; max-width: 380px; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
  
  /* Profile Header UI */
  .profile-header { display: flex; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #f3f4f6; padding-bottom: 16px; }
  .avatar { width: 50px; height: 50px; background-color: #3b82f6; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; margin-right: 15px; }
  .user-info h2 { margin: 0; font-size: 18px; color: #1f2937; text-align: left; }
  .user-info p { margin: 4px 0 0 0; font-size: 13px; color: #1f2937; word-break: break-all; }

  label { font-weight: 600; color: #1f2937; display: block; margin-bottom: 8px; font-size: 14px; }
  input { width: 100%; padding: 14px; margin-bottom: 15px; box-sizing: border-box; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 16px; }
  
  /* Style for when the fields are locked */
  input[readonly] { background-color: #eae7ea; color: #6b7280; cursor: not-allowed; border-color: #c904f3; }
  .lock-msg { font-size: 12px; color: #1f2937; margin-bottom: 20px; font-weight: 600; display: none; margin-top: -5px; }

  button { width: 100%; padding: 16px; margin: 8px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
  button:active { transform: scale(0.98); }
  #btn-in { background-color: #10b981; color: white; }
  #btn-out { background-color: #ef4444; color: white; }
  #status { margin-top: 20px; font-weight: 600; text-align: center; min-height: 24px; padding: 10px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>

<div class="main-content">
  <div class="card">
    
    <div class="profile-header">
      <div class="avatar" id="avatarCircle">Me</div>
      <div class="user-info">
        <h2>Attendance Portal</h2>
        <p id="profileText">Log your daily working hours</p>
      </div>
    </div>
    
    <label for="empName">Employee Name</label>
    <input type="text" id="empName" placeholder="Enter your full name">

    <label for="empEmail">Email Address</label>
    <input type="email" id="empEmail" placeholder="Enter your email address">
    
    <div id="lockMsg" class="lock-msg">🔒 Device securely registered</div>
    
    <button id="btn-in" onclick="handleAttendance('Clock In')">Clock In</button>
    <button id="btn-out" onclick="handleAttendance('Clock Out')">Clock Out</button>
    
    <div id="status"></div>
  </div>
</div>

<script>
  // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
  // PASTE YOUR CORRECT GOOGLE APPS SCRIPT WEB APP URL HERE:
  const API_URL = "https://script.google.com/macros/s/AKfycbzBa05F5C_4teM4PgSqz4-oeuVtL9xhBSxsiVNb5z7fbnBl8Bs9TCwQNkcY-CDpMj4VSw/exec";
  // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

  window.onload = function() {
    const savedName = localStorage.getItem('savedEmployeeName');
    const savedEmail = localStorage.getItem('savedEmployeeEmail');
    
    if (savedName && savedEmail) {
      lockDeviceToUser(savedName, savedEmail);
    }
  };

  function lockDeviceToUser(name, email) {
    const nameInput = document.getElementById('empName');
    const emailInput = document.getElementById('empEmail');
    
    nameInput.value = name;
    emailInput.value = email;
    
    // Lock both inputs
    nameInput.setAttribute('readonly', true); 
    emailInput.setAttribute('readonly', true);
    
    document.getElementById('lockMsg').style.display = 'block';
    
    // Update Profile Header visually
    document.getElementById('avatarCircle').innerText = name.charAt(0).toUpperCase();
    document.getElementById('profileText').innerText = email;
    document.getElementById('profileText').style.color = '#3b82f6';
  }

  async function handleAttendance(action) {
    const name = document.getElementById('empName').value.trim();
    const email = document.getElementById('empEmail').value.trim();
    
    if (!name || !email) return showStatus("⚠️ Please enter both Name and Email.", "#fee2e2", "#991b1b");

    showStatus("📍 Getting location... Please wait.", "#e0f2fe", "#075985");

    if (!navigator.geolocation) return showStatus("❌ GPS not supported on this device.", "#fee2e2", "#991b1b");

    navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        let locationName = `${lat}, ${lon}`; 

        showStatus("🗺️ Translating address...", "#e0f2fe", "#075985");
        try {
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
          const geoData = await geoRes.json();
          if (geoData.display_name) locationName = geoData.display_name;
        } catch(e) { console.log("Geocoding failed."); }

        showStatus("⏳ Saving record...", "#e0f2fe", "#075985");
        // We now send the email to the backend as well
        const url = `${API_URL}?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&action=${encodeURIComponent(action)}&location=${encodeURIComponent(locationName)}`;

        fetch(url).then(res => res.text()).then(resultMsg => {
            if (resultMsg.includes('Success')) {
              showStatus(resultMsg, "#d1fae5", "#065f46");
              
              // Save BOTH to the device and lock it
              localStorage.setItem('savedEmployeeName', name);
              localStorage.setItem('savedEmployeeEmail', email);
              lockDeviceToUser(name, email);
              
            } else {
              showStatus(resultMsg, "#fee2e2", "#991b1b");
            }
          }).catch(() => showStatus("❌ Network Error.", "#fee2e2", "#991b1b"));
      },
      (error) => {
        let errorMsg = "❌ Location failed.";
        if (error.code === 1) errorMsg = "❌ Permission denied. Allow GPS in browser settings.";
        if (error.code === 2) errorMsg = "❌ GPS signal unavailable. Turn on Location on your phone.";
        if (error.code === 3) errorMsg = "❌ GPS timed out. Try stepping outside.";
        showStatus(errorMsg, "#fee2e2", "#991b1b");
      },
      { enableHighAccuracy: true, timeout: 20000 } 
    );
  }

  function showStatus(msg, bg, color) {
    const statusDiv = document.getElementById('status');
    statusDiv.innerText = msg;
    statusDiv.style.backgroundColor = bg;
    statusDiv.style.color = color;
  }
</script>
</body>
</html>
